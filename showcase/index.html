<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[PD] Витрина тем — vc.ru</title>
  <link rel="stylesheet" href="showcase.css?v=background-pattern-2">
  <script defer src="background-patterns.js?v=2"></script>
  <script defer src="showcase.js?v=background-pattern-2"></script>
</head>
<body>
  <header class="toolbar" aria-label="Настройки предпросмотра">
    <div class="toolbar-fields">
      <div class="toolbar-field">
        <span id="theme-label">Тема</span>
        <details class="theme-picker" id="theme-picker" hidden>
          <summary class="toolbar-control" aria-labelledby="theme-label theme-name">
            <span class="theme-swatch" id="theme-swatch" aria-hidden="true"></span>
            <span class="theme-name" id="theme-name"></span>
          </summary>
          <ul class="theme-options" id="theme-options" aria-labelledby="theme-label"></ul>
        </details>
      </div>
      <label class="toolbar-field">
        <span>Режим</span>
        <select id="mode" disabled>
          <option value="light">Светлый</option>
          <option value="dark">Тёмный</option>
        </select>
      </label>
      <label class="toolbar-field">
        <span>Экран</span>
        <select id="screen" disabled>
          <option value="feed">Лента</option>
          <option value="my-feed">Моя лента</option>
          <option value="blog">Блог</option>
          <option value="post">Пост</option>
          <option value="collection">Коллекция</option>
          <option value="rating">Рейтинг</option>
          <option value="marketplace">Магазин</option>
          <option value="popover-profile">Меню профиля</option>
          <optgroup label="Мессенджер">
            <option value="messenger">Сообщения</option>
            <option value="messenger-chat">Диалог</option>
          </optgroup>
          <optgroup label="Настройки">
            <option value="checkboxes">Чекбоксы</option>
            <option value="inputs">Инпуты</option>
          </optgroup>
          <optgroup label="Модальные окна">
            <option value="modal-achievement">Топ-25 авторов</option>
            <option value="modal-pro">Подписка Pro</option>
            <option value="modal-gift-plus">Подарить Plus</option>
          </optgroup>
        </select>
      </label>
      <label class="toolbar-field">
        <span>Паттерн</span>
        <select id="pattern" disabled>
          <option value="theme">По теме</option>
          <option value="none">Без паттерна</option>
          <option value="dots">Точки</option>
          <option value="grid">Сетка</option>
          <option value="diagonal">Диагонали</option>
        </select>
      </label>
      <div class="pattern-sliders">
        <div class="pattern-slider">
          <label for="pattern-size">Размер</label>
          <output for="pattern-size" id="pattern-size-value" aria-hidden="true">24 px</output>
          <input type="range" id="pattern-size" min="8" max="80" value="24" disabled>
        </div>
        <div class="pattern-slider">
          <label for="pattern-opacity">Непрозрачность</label>
          <output for="pattern-opacity" id="pattern-opacity-value" aria-hidden="true">14%</output>
          <input type="range" id="pattern-opacity" min="0" max="100" value="14" disabled>
        </div>
      </div>
    </div>
  </header>
  <p id="status" role="status">Загрузка тем…</p>
  <iframe id="preview" title="Предпросмотр темы vc.ru" hidden></iframe>
</body>
</html>
